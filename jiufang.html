<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九方分环节时效监控</title>
<style>
  :root {
    color-scheme: light;
    --navy: #0e1b30; --navy2: #16233c; --gold: #b8935a; --gold-light: #d9b878;
    --paper: #f6f5f2; --card: #ffffff; --ink: #1c2333; --sub: #6b7280; --line: #e7e5df;
    --forest: #2f6b4f; --amber: #a5762f; --red: #8a2f2f;
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:0 0 60px; font-family:"PingFang SC","Source Han Sans SC","Microsoft YaHei",-apple-system,sans-serif; background:var(--paper); color:var(--ink); }
  .masthead { background:linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%); color:#f3ede2; padding:40px 48px 68px; position:relative; overflow:hidden; }
  .masthead::after { content:""; position:absolute; right:-60px; top:-60px; width:320px; height:320px; border:1px solid rgba(216,184,120,.18); border-radius:50%; }
  .eyebrow { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--gold-light); margin-bottom:10px; font-weight:600; }
  .masthead h1 { margin:0 0 10px; font-size:30px; font-weight:700; letter-spacing:1px; font-family:"Songti SC","Noto Serif SC",serif; }
  .masthead .meta { font-size:13px; color:rgba(243,237,226,.65); letter-spacing:.3px; }
  .masthead .meta b { color:rgba(243,237,226,.95); font-weight:600; }
  .wrap { max-width:1440px; margin:-40px auto 0; padding:0 48px; position:relative; z-index:3; }

  .kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border-radius:14px; overflow:hidden; box-shadow:0 18px 40px -12px rgba(14,27,48,.18); margin-bottom:26px; }
  .kpi { background:var(--card); padding:26px 26px 22px; position:relative; }
  .kpi::before { content:""; position:absolute; left:0; top:22px; bottom:22px; width:3px; border-radius:2px; }
  .kpi.total::before { background:var(--navy); } .kpi.normal::before { background:var(--forest); }
  .kpi.warn::before { background:var(--amber); } .kpi.black::before { background:var(--red); }
  .kpi .label { font-size:11.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--sub); margin-bottom:10px; padding-left:14px; }
  .kpi .num { font-size:34px; font-weight:700; line-height:1; padding-left:14px; font-family:"Songti SC","Noto Serif SC",serif; }
  .kpi.total .num { color:var(--navy); } .kpi.normal .num { color:var(--forest); }
  .kpi.warn .num { color:var(--amber); } .kpi.black .num { color:var(--red); }

  .panel { background:var(--card); border-radius:14px; padding:18px 24px; box-shadow:0 10px 28px -10px rgba(14,27,48,.10); border:1px solid var(--line); margin-bottom:26px; }
  .filter-bar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .filter-bar select, .filter-bar input { padding:8px 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:var(--paper); color:var(--ink); }
  .filter-bar input { flex:1; min-width:200px; }
  .filter-bar select:focus, .filter-bar input:focus { outline:none; border-color:var(--gold); }

  .table-card { background:var(--card); border-radius:14px; box-shadow:0 10px 28px -10px rgba(14,27,48,.10); border:1px solid var(--line); overflow:hidden; contain:layout paint; }
  .table-scroll { overflow:auto; max-height:680px; position:relative; }
  table.data { border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px; white-space:nowrap; }
  table.data thead th { position:sticky; top:0; background:var(--navy); color:rgba(243,237,226,.88); font-weight:600; text-align:left; padding:12px 16px; letter-spacing:.3px; z-index:3; font-size:11px; text-transform:uppercase; cursor:pointer; user-select:none; will-change:transform; }
  table.data thead th:hover { color:var(--gold-light); }
  table.data tbody td { padding:10px 16px; border-bottom:1px solid #f0efea; color:var(--ink); background:var(--card); vertical-align:top; }
  table.data tbody tr:hover td { background:#faf7f1; }
  /* freeze first 4 columns (运单号/国家/运输方式/物流渠道) while horizontally scrolling.
     Using a border instead of box-shadow here, plus will-change/backface-visibility
     hints, because box-shadow on many sticky elements forces the browser to
     repaint it every scroll frame - that's what caused the wobble/flicker with
     300+ rows. A border is composited once and doesn't need repainting. */
  table.data .frozen-col { position:sticky; z-index:2; border-right:1px solid var(--line); will-change:transform; backface-visibility:hidden; }
  table.data thead th.frozen-col { background:var(--navy); z-index:4; }
  table.data tbody td.frozen-col { background:var(--card); }
  table.data tbody tr:hover td.frozen-col { background:#faf7f1; }
  table.data .fc-0 { left:0; min-width:130px; }
  table.data .fc-1 { left:130px; min-width:70px; }
  table.data .fc-2 { left:200px; min-width:80px; }
  table.data .fc-3 { left:280px; min-width:220px; }

  .badge { display:inline-block; padding:4px 12px; border-radius:3px; font-size:11.5px; font-weight:600; letter-spacing:.2px; }
  .badge-ok { background:#eaf3ee; color:var(--forest); } .badge-red { background:#f6e9e9; color:var(--red); }
  .badge-amber { background:#f5ecdf; color:var(--amber); }
  .black-text { color:var(--red); font-weight:600; }
  .foot { text-align:center; color:var(--sub); font-size:12px; margin-top:24px; }

  .remark-cell { position:relative; padding:6px 10px !important; }
  .remark-input { width:220px; min-width:220px; border:1px solid transparent; border-radius:6px; padding:6px 8px; font-size:12.5px; font-family:inherit; color:var(--ink); background:transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .remark-input:hover { border-color:var(--line); background:var(--paper); }
  .remark-input:focus { outline:none; border-color:var(--gold); background:#fff; }
  .remark-status { font-size:10px; color:var(--sub); margin-left:6px; }
  .remark-status.saved { color:var(--forest); }
  .remark-status.error { color:var(--red); }
  .remark-tooltip { display:none; position:fixed; max-width:320px; background:var(--navy); color:#f3ede2; padding:8px 12px; border-radius:8px; font-size:12.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; box-shadow:0 10px 24px -6px rgba(14,27,48,.35); z-index:50; pointer-events:none; }

  .remark-modal-backdrop { display:none; position:fixed; inset:0; background:rgba(14,27,48,.45); z-index:100; align-items:center; justify-content:center; }
  .remark-modal-backdrop.open { display:flex; }
  .remark-modal { background:var(--card); border-radius:14px; width:440px; max-width:90vw; box-shadow:0 24px 60px -12px rgba(14,27,48,.35); overflow:hidden; }
  .remark-modal-header { background:linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%); color:#f3ede2; padding:18px 22px; }
  .remark-modal-header .label { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gold-light); margin-bottom:6px; font-weight:600; }
  .remark-modal-header .sn { font-family:"Songti SC","Noto Serif SC",serif; font-size:19px; font-weight:700; }
  .remark-modal-body { padding:20px 22px; }
  .remark-modal-body textarea { width:100%; min-height:130px; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13.5px; font-family:inherit; line-height:1.6; resize:vertical; color:var(--ink); }
  .remark-modal-body textarea:focus { outline:none; border-color:var(--gold); }
  .remark-modal-footer { padding:0 22px 20px; display:flex; align-items:center; justify-content:flex-end; gap:10px; }
  .remark-modal-status { font-size:11.5px; color:var(--sub); margin-right:auto; }
  .remark-modal-status.saved { color:var(--forest); }
  .remark-modal-status.error { color:var(--red); }
  .remark-modal-footer button { padding:9px 18px; border-radius:8px; font-size:13px; cursor:pointer; border:1px solid var(--line); background:var(--paper); color:var(--ink); }
  .remark-modal-footer button.primary { background:var(--navy); color:#f3ede2; border-color:var(--navy); }
</style>
</head>

          <th data-key="航班抵达(到港)">航班抵达(到港)</th>
          <th data-key="清关时间(清关放行)">清关时间(清关放行)</th>

          <th data-key="预警">预警</th>
          <th data-key="黑色预警">黑色预警</th>
          <th data-key="Remark">Remark</th>
        </tr></thead>
        <tbody id="data-tbody"></tbody>
      </table>
    </div>
  </div>
  <div class="foot">Plaud · 九方分环节时效监控（独立数据源）</div>
</div>
<div class="remark-tooltip" id="remark-tooltip"></div>

<div class="remark-modal-backdrop" id="remark-modal-backdrop">

  </div>
</div>

function escapeAttr(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function saveRemark(sn, remark, statusEl, onSuccess) {
  const base = 'remark-modal-status';
  if (!WORKER_URL) {
    statusEl.textContent = '未配置云端保存';
    statusEl.className = base + ' error';
    return;
  }
  statusEl.textContent = '保存中...';
  statusEl.className = base;
  fetch(WORKER_URL + '/remarks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sn, remark }),
  }).then(r => r.json()).then(res => {
    if (res.ok) {
      statusEl.textContent = '已保存';
      statusEl.className = base + ' saved';
      if (rowsBySn[sn]) rowsBySn[sn]['Remark'] = remark;
      if (onSuccess) onSuccess();
      setTimeout(() => { statusEl.textContent = ''; }, 1500);
    } else {
      statusEl.textContent = '保存失败';
      statusEl.className = base + ' error';
    }
  }).catch(() => {
    statusEl.textContent = '保存失败(网络)';
    statusEl.className = base + ' error';
  });
}

function warnBadge(w) {
  if (w === '正常') return `<span class="badge badge-ok">${w}</span>`;
  if (['超时未达标'].includes(w)) return `<span class="badge badge-red">${w}</span>`;
  return `<span class="badge badge-amber">${w}</span>`;
}

// date filter defaults to the last 60 days (full data goes back to
// 2026-01-01, but that's opt-in via the date inputs, not the default view)
function toDateInputValue(d) {
  return d.toISOString().slice(0, 10);
}
const today = new Date();
const sixtyDaysAgo = new Date(today.getTime() - 60 * 86400000);
document.getElementById('f-date-end').value = toDateInputValue(today);
document.getElementById('f-date-start').value = toDateInputValue(sixtyDaysAgo);
document.getElementById('f-date-reset').addEventListener('click', () => {
  document.getElementById('f-date-end').value = toDateInputValue(new Date());
  document.getElementById('f-date-start').value = toDateInputValue(new Date(Date.now() - 60 * 86400000));
  render();
});

let sortKey = null, sortDir = 1;
function render() {
  const country = document.getElementById('f-country').value;
  const transport = document.getElementById('f-transport').value;
  const warnF = document.getElementById('f-warn').value;
  const q = document.getElementById('f-search').value.trim().toLowerCase();
  const dateStart = document.getElementById('f-date-start').value; // 'YYYY-MM-DD' or ''
  const dateEnd = document.getElementById('f-date-end').value;

  let filtered = ROWS.filter(r => {
    if (country && r['国家'] !== country) return false;
    if (transport && r['运输方式'] !== transport) return false;
    if (warnF && r['预警'] !== warnF) return false;
    if (q && !((r['服务商单号']||'').toLowerCase().includes(q) || (r['物流渠道']||'').toLowerCase().includes(q))) return false;
    const orderDate = (r['下单时间'] || '').slice(0, 10);
    if (dateStart && orderDate < dateStart) return false;
    if (dateEnd && orderDate > dateEnd) return false;
    return true;
  });

  const kpiTotal = filtered.length;
  const kpiNormal = filtered.filter(r => r['预警'] === '正常').length;
  const kpiBlack = filtered.filter(r => r['黑色预警']).length;
  document.getElementById('kpi-total').textContent = kpiTotal;
  document.getElementById('kpi-normal').textContent = kpiNormal;
  document.getElementById('kpi-warn').textContent = kpiTotal - kpiNormal - kpiBlack;
  document.getElementById('kpi-black').textContent = kpiBlack;

  if (sortKey) {
    filtered.sort((a,b) => {
      let va = a[sortKey] ?? '', vb = b[sortKey] ?? '';
      if (typeof va === 'number' || typeof vb === 'number') return (va - vb) * sortDir;
      return String(va).localeCompare(String(vb)) * sortDir;
    });
  }

  const tbody = document.getElementById('data-tbody');
  tbody.innerHTML = filtered.map(r => `<tr>
    <td class="frozen-col fc-0">${r['服务商单号']||''}</td>
    <td class="frozen-col fc-1">${r['国家']||''}</td>
    <td class="frozen-col fc-2">${r['运输方式']||''}</td>
    <td class="frozen-col fc-3">${r['物流渠道']||''}</td>
    <td>${r['下单时间']||''}</td>
    <td>${r['工厂发货(入库)']||''}</td>
    <td>${r['航班起飞(离港)']||''}</td>
    <td>${r['航班抵达(到港)']||''}</td>
    <td>${r['清关时间(清关放行)']||''}</td>
    <td>${r['到仓时间(签收)']||''}</td>
    <td>${r['服务商时效']??''}</td>
    <td>${warnBadge(r['预警']||'')}</td>
    <td>${r['黑色预警'] ? '<span class="black-text">🚨'+r['黑色预警']+'</span>' : ''}</td>
    <td class="remark-cell">
      <input class="remark-input" type="text" readonly placeholder="添加备注..." title="${escapeAttr(r['Remark']||'')}" data-sn="${escapeAttr(r['服务商单号'])}" value="${escapeAttr(r['Remark']||'')}">
    </td>
  </tr>`).join('');
}

// custom tooltip for a quick glance without opening the modal - native
// `title` tooltips are slow/inconsistent across browsers, so show our own
// floating box immediately on hover instead, only when the text is actually
// truncated (scrollWidth > clientWidth).
const tooltipEl = document.getElementById('remark-tooltip');
document.getElementById('data-tbody').addEventListener('mouseover', (e) => {
  const el = e.target;
  if (!el.classList || !el.classList.contains('remark-input')) return;
  if (!el.value || el.scrollWidth <= el.clientWidth + 1) return;
  tooltipEl.textContent = el.value;
  const rect = el.getBoundingClientRect();
  tooltipEl.style.display = 'block';
  tooltipEl.style.left = Math.max(8, rect.left) + 'px';
  tooltipEl.style.top = (rect.bottom + 6) + 'px';
}, true);
document.getElementById('data-tbody').addEventListener('mouseout', (e) => {
  if (!e.target.classList || !e.target.classList.contains('remark-input')) return;
  tooltipEl.style.display = 'none';
}, true);

// clicking the Remark cell opens a modal (运单号 + full-size textarea) instead
// of editing inline, so the whole remark is always visible while typing.
const modalBackdrop = document.getElementById('remark-modal-backdrop');
const modalSnEl = document.getElementById('remark-modal-sn');
const modalTextarea = document.getElementById('remark-modal-textarea');
const modalStatus = document.getElementById('remark-modal-status');
let modalSn = null;

function openRemarkModal(sn) {
  modalSn = sn;
  modalSnEl.textContent = sn;
  modalTextarea.value = (rowsBySn[sn] && rowsBySn[sn]['Remark']) || '';
  modalStatus.textContent = '';
  modalStatus.className = 'remark-modal-status';
  modalBackdrop.classList.add('open');
  tooltipEl.style.display = 'none';
  setTimeout(() => modalTextarea.focus(), 0);
}
function closeRemarkModal() {
  modalBackdrop.classList.remove('open');
  modalSn = null;
}

document.getElementById('data-tbody').addEventListener('click', (e) => {
  if (!e.target.classList || !e.target.classList.contains('remark-input')) return;
  openRemarkModal(e.target.dataset.sn);
}, true);

document.getElementById('remark-modal-cancel').addEventListener('click', closeRemarkModal);
modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeRemarkModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalBackdrop.classList.contains('open')) closeRemarkModal();
});

document.getElementById('remark-modal-save').addEventListener('click', () => {
  if (!modalSn) return;
  const sn = modalSn;
  const value = modalTextarea.value;
  saveRemark(sn, value, modalStatus, () => {
    const inlineInput = document.querySelector(`.remark-input[data-sn="${CSS.escape(sn)}"]`);
    if (inlineInput) { inlineInput.value = value; inlineInput.title = value; }
    setTimeout(closeRemarkModal, 400);
  });
});

document.querySelectorAll('#data-table thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    render();
  });
});
['f-country','f-transport','f-warn','f-date-start','f-date-end'].forEach(id => document.getElementById(id).addEventListener('change', render));
document.getElementById('f-search').addEventListener('input', render);
render();
</script>
</body>
</html>
